name: Main

on:
  push:
    branches: [main]
    paths:
      - .editorconfig
      - .github/**
      - '*.slnx'
      - Directory.Build.props
      - global.json
      - packaging/**
      - src/**
      - tests/**
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
