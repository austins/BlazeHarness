name: Set up .NET environment
description: Installs the .NET SDK and restores the NuGet package cache (NUGET_PACKAGES must point into the workspace).
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 11.x
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
